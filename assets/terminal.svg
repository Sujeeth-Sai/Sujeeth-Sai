<style>@keyframes blink{50%{opacity:0}}.cursor{animation:blink 1.2s step-end infinite}@keyframes flow{to{stroke-dashoffset:-80}}.flow{animation:flow 4s linear infinite}@media(prefers-reduced-motion:reduce){.cursor,.flow{animation:none}}</style>
