<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Sai Sujeeth — Ideas into interfaces. Curiosity into code.</title>
<desc id="desc">Animated orbital artwork beside Sai Sujeeth's name. Building across AI, web, mobile and on-chain systems.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080c18"/><stop offset="1" stop-color="#101629"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#78f5d0"/><stop offset=".5" stop-color="#75c6ff"/><stop offset="1" stop-color="#b8a1ff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#6960dd" stop-opacity=".3"/><stop offset="1" stop-color="#6960dd" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b5c7ff" stroke-opacity=".045"/></pattern>
</defs>
<style>
 .orbit{transform-origin:941px 232px;animation:spin 28s linear infinite}.reverse{animation-direction:reverse;animation-duration:38s}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 1.4s steps(2,end) infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.orbit,.pulse,.cursor{animation:none}}
</style>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/><rect width="1200" height="480" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="478" rx="23" fill="none" stroke="#26324b"/>
<circle cx="941" cy="232" r="260" fill="url(#halo)"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
<circle cx="54" cy="48" r="4" fill="#78f5d0" class="pulse"/><text x="69" y="53" fill="#a6b3cc" font-size="12" letter-spacing="2">SUJEETH-SAI / BUILDER'S LOG</text>
<text x="52" y="143" fill="#78f5d0" font-size="14" letter-spacing="3">HELLO, WORLD. I'M</text>
<text x="48" y="219" fill="#f2f5ff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" letter-spacing="-3">Sai Sujeeth.</text>
<text x="52" y="274" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500">Ideas into interfaces.</text>
<text x="52" y="311" fill="#a6b3cc" font-family="Arial, Helvetica, sans-serif" font-size="27">Curiosity into code.</text>
<path d="M52 353H630" stroke="#26324b"/>
<text x="52" y="385" fill="#c3cee3" font-size="13" letter-spacing="1">AI SYSTEMS</text><text x="172" y="385" fill="#586581">/</text>
<text x="198" y="385" fill="#c3cee3" font-size="13" letter-spacing="1">WEB</text><text x="246" y="385" fill="#586581">/</text>
<text x="272" y="385" fill="#c3cee3" font-size="13" letter-spacing="1">MOBILE</text><text x="347" y="385" fill="#586581">/</text>
<text x="373" y="385" fill="#c3cee3" font-size="13" letter-spacing="1">ON-CHAIN</text>
<text x="52" y="445" fill="#71819e" font-size="12">&gt; turning the next what-if into a working thing</text><rect class="cursor" x="406" y="434" width="7" height="14" fill="#78f5d0"/>
</g>
<g fill="none" stroke="#404866"><circle cx="941" cy="232" r="165" stroke-dasharray="2 9"/><circle cx="941" cy="232" r="125"/><circle cx="941" cy="232" r="85" stroke-opacity=".6"/></g>
<g class="orbit"><ellipse cx="941" cy="232" rx="175" ry="62" fill="none" stroke="#78f5d0" stroke-opacity=".7"/><circle cx="1116" cy="232" r="6" fill="#78f5d0"/><circle cx="766" cy="232" r="3" fill="#78f5d0"/></g>
<g class="orbit reverse"><ellipse cx="941" cy="232" rx="65" ry="175" fill="none" stroke="#a696ff" stroke-opacity=".75"/><circle cx="941" cy="57" r="6" fill="#b7a4ff"/></g>
<circle cx="941" cy="232" r="53" fill="#111b30" stroke="#78f5d0" stroke-opacity=".6"/>
<text x="941" y="244" text-anchor="middle" fill="#eef5ff" font-family="ui-monospace,monospace" font-size="36" font-weight="700">S.</text>
<text x="941" y="449" text-anchor="middle" fill="#71819e" font-family="monospace" font-size="11" letter-spacing="3">EXPLORE. BUILD. ITERATE.</text>
</svg>
